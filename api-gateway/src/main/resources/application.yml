server:
  port: 4008 # Gateway listens on port 4008

spring:
  cloud:
    gateway:
      routes:
        ## localhost:4008/auth/login
        # API-GATEWAY-> http://auth-service:4009/login
        - id: auth-service-route
          uri: http://auth-service:4009
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        # Route for /api/patients/** to patient-service
        - id: patient-service-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api/patients/**
          filters:
            - StripPrefix=1
            - JwtValidation

        # Route for /api/docs/patients to patient-service /v3/api-docs
        - id: api-docs-patient-route
          uri: http://patient-service:4000
          predicates:
            - Path=/api-docs/patients
          filters:
            - RewritePath=/api-docs/patients,/v3/api-docs


        - id: api-docs-auth-route
          uri: http://auth-service:4005
          predicates:
              - Path=/api-docs/auth
          filters:
              - RewritePath=/api-docs/auth,/v3/api-docs

